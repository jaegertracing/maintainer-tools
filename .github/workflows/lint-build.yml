name: 'Lint and Build'

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event.pull_request && github.event.pull_request.number) || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24
      - run: make install
      - run: make lint
      - run: make test
      - run: make build

      # Committed action bundles must match their source because GitHub runs them directly.
      - name: Ensure action bundles are in sync with src
        run: |
          if ! git diff --quiet --exit-code -- pr-nudge/dist pr-weekly-digest/dist; then
            echo "::error::Action bundles are out of date. Run \`make build\` and commit the result."
            git --no-pager diff -- pr-nudge/dist pr-weekly-digest/dist | head -200
            exit 1
          fi

  validate-3rd-party-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: validate Renovate config
        run: |
          docker run \
            -v $PWD/renovate.json:/usr/src/app/renovate.json \
            ghcr.io/renovatebot/renovate:latest \
            renovate-config-validator
